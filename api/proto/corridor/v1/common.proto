syntax = "proto3";

package corridor.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/xJohnNascimento/corridor/api/corridor/v1;corridorv1";

// Amounts are canonical base-10 integer strings in minor units.
message Money {
  string currency = 1;
  string amount = 2;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_VALIDATION_FAILED = 1;
  ERROR_REASON_IDEMPOTENCY_MISMATCH = 2;
  ERROR_REASON_AMOUNT_OUT_OF_RANGE = 3;
  ERROR_REASON_CORRIDOR_DISABLED = 4;
  ERROR_REASON_QUOTE_EXPIRED = 5;
  ERROR_REASON_QUOTE_USED = 6;
  ERROR_REASON_NOT_FOUND = 7;
  ERROR_REASON_UNAUTHENTICATED = 8;
  ERROR_REASON_RATE_LIMITED = 9;
  ERROR_REASON_UNAVAILABLE = 10;
  ERROR_REASON_PERMISSION_DENIED = 11;
}

// Attached to every error Corridor returns. Only the fields relevant to the reason are set.
message ErrorDetail {
  ErrorReason reason = 1;
  string payment_id = 2;
  int32 retry_after_seconds = 3;
}

enum SnapshotStatus {
  SNAPSHOT_STATUS_UNSPECIFIED = 0;
  SNAPSHOT_STATUS_COMPLETE = 1;
  SNAPSHOT_STATUS_INCOMPLETE = 2;
}

message SnapshotHeader {
  int32 schema_version = 1;
  string source_id = 2;
  string dataset_id = 3;
  google.protobuf.Timestamp captured_at = 4;
}

message SnapshotTrailer {
  SnapshotStatus status = 1;
  map<string, int64> counts = 2;
  string content_hash = 3;
}
